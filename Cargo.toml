[package]
name = "mcp-server-grok-management"
version = "0.1.0"
edition = "2024"
description = "MCP server for the xAI Management API — API keys, ACLs, audit logs, and billing"

[dependencies]
rmcp = { version = "1.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
toml = "0.8"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
urlencoding = "2"

[profile.release]
lto = true
strip = true
